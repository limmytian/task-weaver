services:
  migrate:
    image: ${TW_API_IMAGE:-ghcr.io/limmytian/task-weaver-api@sha256:beb2ee810fdc0880d955c7dfdd245a0bfb838e3bbbad1ae457ddf46656ba00a4}
    working_dir: /app
    command: ["sh", "-c", "./node_modules/.bin/tsx node_modules/@task-weaver/db/src/migrate.ts && ./node_modules/.bin/tsx node_modules/@task-weaver/db/src/setup-search.ts"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?Configure an external PostgreSQL connection}}

  api:
    image: ${TW_API_IMAGE:-ghcr.io/limmytian/task-weaver-api@sha256:beb2ee810fdc0880d955c7dfdd245a0bfb838e3bbbad1ae457ddf46656ba00a4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure an external PostgreSQL connection}
      TW_AUTH_SECRET: ${TW_AUTH_SECRET:?Set TW_AUTH_SECRET in .env}
      TW_AUTH_BASE_URL: ${TW_AUTH_BASE_URL:?Set TW_AUTH_BASE_URL in .env}
      TW_AUTH_TRUSTED_ORIGINS: ${TW_AUTH_TRUSTED_ORIGINS:?Set TW_AUTH_TRUSTED_ORIGINS in .env}
      TW_AUTH_BOOTSTRAP_SECRET: ${TW_AUTH_BOOTSTRAP_SECRET:-}
      NODE_ENV: production
      TW_VERSION_CHECK_ENABLED: ${TW_VERSION_CHECK_ENABLED:-true}
      TW_MCP_ALLOWED_HOSTS: ${TW_MCP_ALLOWED_HOSTS:-}
      TW_MCP_READ_ONLY: ${TW_MCP_READ_ONLY:-false}
      TW_DAEMON_MODE: polling
      SKILL_PACKAGE_STORAGE_DIR: /app/data/skill-packages
      TW_ATTACHMENT_STORAGE_DIR: /app/attachment-data
      TW_ATTACHMENT_MAX_BYTES: ${TW_ATTACHMENT_MAX_BYTES:-52428800}
    volumes:
      - skill-data:/app/data
      - attachment-data:/app/attachment-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${TW_WEB_IMAGE:-ghcr.io/limmytian/task-weaver-web@sha256:a5f7b11ceacdd5098fab7388b95c6509036d27a20c049bd01fe00fb3bfee562b}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure an external PostgreSQL connection}
      TW_AUTH_SECRET: ${TW_AUTH_SECRET:?Set TW_AUTH_SECRET in .env}
      TW_AUTH_BASE_URL: ${TW_AUTH_BASE_URL:?Set TW_AUTH_BASE_URL in .env}
      TW_AUTH_TRUSTED_ORIGINS: ${TW_AUTH_TRUSTED_ORIGINS:?Set TW_AUTH_TRUSTED_ORIGINS in .env}
      TW_AUTH_BOOTSTRAP_SECRET: ${TW_AUTH_BOOTSTRAP_SECRET:-}
      TW_VERSION_CHECK_ENABLED: ${TW_VERSION_CHECK_ENABLED:-true}
      TW_API_URL: http://api:3001
      TW_ATTACHMENT_STORAGE_DIR: /app/attachment-data
      TW_ATTACHMENT_MAX_BYTES: ${TW_ATTACHMENT_MAX_BYTES:-52428800}
      NODE_ENV: production
    volumes:
      - attachment-data:/app/attachment-data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  attachment-data:
  skill-data:
