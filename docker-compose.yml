services:
  migrate:
    image: ${TW_API_IMAGE:-ghcr.io/limmytian/task-weaver-api@sha256:7d89b0bfe4adf251d7831fbed0b473fae631aca0befc862d06e07ebf58442359}
    platform: ${TW_IMAGE_PLATFORM:-linux/arm64}
    working_dir: /app
    command: ["sh", "-c", "./node_modules/.bin/tsx node_modules/@task-weaver/db/src/migrate.ts && ./node_modules/.bin/tsx node_modules/@task-weaver/db/src/setup-search.ts"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?Configure an external PostgreSQL connection}}

  api:
    image: ${TW_API_IMAGE:-ghcr.io/limmytian/task-weaver-api@sha256:7d89b0bfe4adf251d7831fbed0b473fae631aca0befc862d06e07ebf58442359}
    platform: ${TW_IMAGE_PLATFORM:-linux/arm64}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure an external PostgreSQL connection}
      NODE_ENV: production
      TW_DAEMON_MODE: polling
      SKILL_PACKAGE_STORAGE_DIR: /app/data/skill-packages
    volumes:
      - skill-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${TW_WEB_IMAGE:-ghcr.io/limmytian/task-weaver-web@sha256:3d9dbbf08c73c888fd9d9f18b66ed7520113a2f698deab84bc5f4a34455d5e35}
    platform: ${TW_IMAGE_PLATFORM:-linux/arm64}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure an external PostgreSQL connection}
      TW_API_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  skill-data:
