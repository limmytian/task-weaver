name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check module dependency and compatibility boundaries
        run: |
          pnpm check:ce-version
          pnpm check:module-boundaries
      - name: Build all workspaces
        run: pnpm build
      - name: Type check all workspaces
        run: pnpm typecheck
      - name: Lint configured workspaces
        run: pnpm lint
      - name: Test all configured workspaces
        run: pnpm test
      - name: Verify authentication with disposable PostgreSQL
        run: pnpm test:auth-postgres
      - name: Verify inbound MCP with disposable PostgreSQL
        run: pnpm test:mcp-postgres
      - name: Check rollout and Web interaction safeguards
        run: |
          pnpm check:repository-rollout
          pnpm --filter @task-weaver/web check:interactions
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "0"
      TASK_WEAVER_AUDIT_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release tooling
        run: pnpm test:release-gates
      - name: Run release gates
        run: pnpm release:verify

  publish-main-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-validation, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: publish-main-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: anchore/sbom-action/download-syft@v0
      - uses: anchore/scan-action/download-grype@v7.4.0
      - name: Build and publish the main API image candidate
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-api:main-candidate
          build-args: TW_BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and publish the main Web image candidate
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-web:main-candidate
          build-args: TW_BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan the API candidate
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}-api@${{ steps.api.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: api-vulnerabilities.json
      - name: Scan the Web candidate
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}-web@${{ steps.web.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: web-vulnerabilities.json
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign the API candidate
        env:
          IMAGE_DIGEST: ${{ steps.api.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-api@${IMAGE_DIGEST}"
      - name: Sign the Web candidate
        env:
          IMAGE_DIGEST: ${{ steps.web.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-web@${IMAGE_DIGEST}"
      - name: Move latest tags to the scanned main images
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-api:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}-api@${API_DIGEST}"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-web:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}-web@${WEB_DIGEST}"
