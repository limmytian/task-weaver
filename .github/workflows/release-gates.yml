name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check module dependency and compatibility boundaries
        run: |
          pnpm check:ce-version
          pnpm check:module-boundaries
      - name: Build all workspaces
        run: pnpm build
      - name: Type check all workspaces
        run: pnpm typecheck
      - name: Lint configured workspaces
        run: pnpm lint
      - name: Test all configured workspaces
        run: pnpm test
      - name: Verify authentication with disposable PostgreSQL
        run: pnpm test:auth-postgres
      - name: Verify inbound MCP with disposable PostgreSQL
        run: pnpm test:mcp-postgres
      - name: Verify execution recovery with disposable PostgreSQL
        run: pnpm test:execution-recovery-postgres
      - name: Verify workflow and evidence reads with disposable PostgreSQL
        run: pnpm test:workflow-postgres
      - name: Check rollout and Web interaction safeguards
        run: |
          pnpm check:repository-rollout
          pnpm --filter @task-weaver/web check:interactions
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "0"
      TASK_WEAVER_AUDIT_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release tooling
        run: pnpm test:release-gates
      - name: Run release gates
        run: pnpm release:verify

  publish-main-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-validation, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: task-weaver-image-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
      - uses: anchore/scan-action/download-grype@v7.4.0
        id: grype
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Expose installed scanner tools
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
          GRYPE_COMMAND: ${{ steps.grype.outputs.cmd }}
        run: |
          printf '%s\n' "$(dirname "$SYFT_COMMAND")" "$(dirname "$GRYPE_COMMAND")" >> "$GITHUB_PATH"
      - name: Prepare patched multi-platform image candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-main-image-candidates.mjs
      - name: Read the API candidate digest
        id: api
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-api:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Read the Web candidate digest
        id: web
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-web:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan the API candidate
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}-api@${{ steps.api.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: api-vulnerabilities.json
      - name: Scan the Web candidate
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}-web@${{ steps.web.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: web-vulnerabilities.json
      - name: Verify BusyBox request controls on each published platform
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            for app in api web; do
              if [ "$app" = api ]; then digest="$API_DIGEST"; else digest="$WEB_DIGEST"; fi
              repository="ghcr.io/${GITHUB_REPOSITORY}-${app}"
              architecture="${platform#linux/}"
              platform_digest=$(docker buildx imagetools inspect "${repository}@${digest}" --raw |
                jq -er --arg architecture "$architecture" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest] | if length == 1 then .[0] else error("Expected exactly one platform manifest") end')
              image="${repository}@${platform_digest}"
              docker pull --platform "$platform" "$image"
              node scripts/verify-busybox-wget.mjs "$image" "$platform"
            done
          done
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign the API candidate
        env:
          IMAGE_DIGEST: ${{ steps.api.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-api@${IMAGE_DIGEST}"
      - name: Sign the Web candidate
        env:
          IMAGE_DIGEST: ${{ steps.web.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-web@${IMAGE_DIGEST}"
      - name: Promote the signed, scanned pair
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./packages/contracts/package.json").version')
          node scripts/promote-image-pair.mjs main "$VERSION" "$API_DIGEST" "$WEB_DIGEST"
      - name: Retain patched candidate source and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-image-candidate-evidence
          path: |
            release-artifacts/main-candidates/
            release-artifacts/busybox-wget/
            api-vulnerabilities.json
            web-vulnerabilities.json
          if-no-files-found: warn
