name: Release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check module dependency and compatibility boundaries
        run: |
          pnpm check:ce-version
          pnpm check:module-boundaries
      - name: Build all workspaces
        run: pnpm build
      - name: Type check all workspaces
        run: pnpm typecheck
      - name: Lint configured workspaces
        run: pnpm lint
      - name: Test all configured workspaces
        run: pnpm test
      - name: Check rollout and Web interaction safeguards
        run: |
          pnpm check:repository-rollout
          pnpm --filter @task-weaver/web check:interactions
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "0"
      TASK_WEAVER_AUDIT_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release tooling
        run: pnpm test:release-gates
      - name: Run release gates
        run: pnpm release:verify
