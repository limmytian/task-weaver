# Disposable, single-machine local trial. Ports are loopback-only. Do not expose
# this Compose project to a network or use it with non-disposable credentials.
services:
  database:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: task_weaver
      POSTGRES_USER: task_weaver
      POSTGRES_PASSWORD: ${TW_LOCAL_DATABASE_PASSWORD:?Run the local bootstrap helper first}
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_weaver -d task_weaver"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: ghcr.io/limmytian/task-weaver-api:latest
    working_dir: /app
    command: ["sh", "-c", "./node_modules/.bin/tsx node_modules/@task-weaver/db/src/migrate.ts && ./node_modules/.bin/tsx node_modules/@task-weaver/db/src/setup-search.ts"]
    environment:
      DATABASE_URL: postgresql://task_weaver:${TW_LOCAL_DATABASE_PASSWORD}@database:5432/task_weaver
    depends_on:
      database:
        condition: service_healthy

  api:
    image: ghcr.io/limmytian/task-weaver-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://task_weaver:${TW_LOCAL_DATABASE_PASSWORD}@database:5432/task_weaver
      TW_AUTH_SECRET: ${TW_LOCAL_AUTH_SECRET:?Run the local bootstrap helper first}
      TW_AUTH_BASE_URL: http://localhost:3001
      TW_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      TW_AUTH_BOOTSTRAP_SECRET: ${TW_LOCAL_BOOTSTRAP_SECRET:?Run the local bootstrap helper first}
      NODE_ENV: production
      TW_DAEMON_MODE: polling
      SKILL_PACKAGE_STORAGE_DIR: /app/data/skill-packages
      TW_ATTACHMENT_STORAGE_DIR: /app/attachment-data
      TW_ATTACHMENT_MAX_BYTES: 52428800
    volumes:
      - local-skills:/app/data
      - local-attachments:/app/attachment-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ghcr.io/limmytian/task-weaver-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://task_weaver:${TW_LOCAL_DATABASE_PASSWORD}@database:5432/task_weaver
      TW_AUTH_SECRET: ${TW_LOCAL_AUTH_SECRET:?Run the local bootstrap helper first}
      TW_AUTH_BASE_URL: http://localhost:3001
      TW_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      TW_AUTH_BOOTSTRAP_SECRET: ${TW_LOCAL_BOOTSTRAP_SECRET:?Run the local bootstrap helper first}
      TW_API_URL: http://api:3001
      TW_ATTACHMENT_STORAGE_DIR: /app/attachment-data
      TW_ATTACHMENT_MAX_BYTES: 52428800
      NODE_ENV: production
    volumes:
      - local-attachments:/app/attachment-data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  local-postgres:
  local-skills:
  local-attachments:
