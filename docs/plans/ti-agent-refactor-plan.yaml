projectId: 00000000-0000-4000-8000-000000000001

documents:
  - key: ti-agent-arch
    title: Ti Agent Architecture & Partners E2B Integration
    contentFile: ../ti-agent-architecture.md
    docType: design
    tags: [ti-agent, architecture, partners, e2b, chat, token-usage]

requirements:
  - key: req-ti-clean-rebrand
    title: Complete Retirement of Pi and Clean Ti Agent Rebranding
    status: approved
    priority: high
    modelTier: strong
    documents:
      - document: ti-agent-arch
        type: documents
    slices:
      - key: slice-db-schema
        title: Database Schema Replacement
        orderIndex: 0
        tasks: [task-drop-pi-create-ti-tables]
      - key: slice-contracts-core
        title: Contracts and Core Services Overhaul
        orderIndex: 1
        tasks: [task-contracts-ti-schemas, task-core-ti-service]
      - key: slice-api-trpc
        title: API Routes and tRPC Replacement
        orderIndex: 2
        tasks: [task-api-ti-routes, task-trpc-ti-router]
    tasks:
      - key: task-drop-pi-create-ti-tables
        title: Drop legacy pi_* tables and create canonical ti_agent_* schemas
        priority: high
        comments:
          - "Planning: Do not create backwards-compatibility wrappers. Drop pi_agent_model_configs, pi_agent_runs, pi_agent_policies and create ti_agent_* tables cleanly."
        documents:
          - document: ti-agent-arch
            type: references
      - key: task-contracts-ti-schemas
        title: Replace Pi contracts with canonical Ti Agent schemas
        priority: high
        dependsOn:
          - task: task-drop-pi-create-ti-tables
            type: blocks
        comments:
          - "Planning: Define clean Zod validation schemas in @task-weaver/contracts for ti_agent configs, runs, policies, and token usage."
      - key: task-core-ti-service
        title: Implement canonical tiAgentService in core package
        priority: high
        dependsOn:
          - task: task-contracts-ti-schemas
            type: blocks
        comments:
          - "Planning: Implement core business logic for model config resolution, run lifecycle, and lease management in packages/core."
      - key: task-api-ti-routes
        title: Mount REST endpoints under /api/v1/ti/*
        priority: high
        dependsOn:
          - task: task-core-ti-service
            type: blocks
        comments:
          - "Planning: Remove legacy /api/v1/pi-agent/* routes and expose clean /api/v1/ti/* endpoints in Hono API."
      - key: task-trpc-ti-router
        title: Overhaul tRPC tiAgent router and frontend types
        priority: high
        dependsOn:
          - task: task-core-ti-service
            type: blocks

  - key: req-chat-session-history
    title: Chat Multi-Session Management and Conversation History
    status: approved
    priority: high
    modelTier: standard
    documents:
      - document: ti-agent-arch
        type: documents
    slices:
      - key: slice-chat-backend
        title: Chat Conversation Backend Management
        orderIndex: 0
        tasks: [task-chat-conversation-service, task-chat-trpc-endpoints]
      - key: slice-chat-ui
        title: Assistant Dialog Multi-Session UI
        orderIndex: 1
        tasks: [task-chat-ui-session-manager]
    tasks:
      - key: task-chat-conversation-service
        title: Add conversation CRUD and message history queries in assistant service
        priority: high
        comments:
          - "Planning: Support listConversations, getConversation with message history, deleteConversation, and renameConversation in packages/core."
      - key: task-chat-trpc-endpoints
        title: Expose conversation lifecycle procedures in assistant tRPC router
        priority: high
        dependsOn:
          - task: task-chat-conversation-service
            type: blocks
        comments:
          - "Planning: Expose list, get, create, and delete procedures with actor and scope isolation in assistantRouter."
      - key: task-chat-ui-session-manager
        title: Upgrade AssistantDialog with session switcher, history drawer, and delete confirmation
        priority: high
        dependsOn:
          - task: task-chat-trpc-endpoints
            type: blocks
        comments:
          - "Planning: Allow users to switch between past conversations, start a new chat, and delete old sessions with cascading cleanup."

  - key: req-partners-e2b-runtime
    title: Brain-Compute Separation with Partners E2B Sandbox and Storage Optimization
    status: approved
    priority: high
    modelTier: strong
    documents:
      - document: ti-agent-arch
        type: documents
    slices:
      - key: slice-brain-react
        title: Brain ReAct Engine and Model Routing
        orderIndex: 0
        tasks: [task-brain-react-loop, task-token-accounting]
      - key: slice-compute-sandbox
        title: Partners E2B Sandbox Compute Adapter
        orderIndex: 1
        tasks: [task-partners-e2b-driver, task-storage-workspace-cleanup]
    tasks:
      - key: task-brain-react-loop
        title: Implement ReAct planning and tool execution loop driven by configured models
        priority: high
        comments:
          - "Planning: Ensure configured LLMs act as the sole brain/decision-maker, formulating commands and evaluating sandbox execution outputs."
      - key: task-token-accounting
        title: Connect Ti Agent and Chat execution turns to agent_usage_runs ledger
        priority: high
        comments:
          - "Planning: Capture input, output, and cache token statistics from LLM calls and record them into the unified token usage database."
      - key: task-partners-e2b-driver
        title: Implement E2B-compatible sandbox compute adapter in partners-gateway
        priority: high
        comments:
          - "Planning: Build sandbox driver supporting process execution, filesystem operations, and interactive event streaming via Partners E2B protocol."
          - "Partners Receipt Alignment: Tracks upstream Partners task 6f8ab156-a559-4b85-81ce-b4d0dda1aa65 (Two-way workspace file sync POST /v1/sessions/:id/workspace/sync) and 01a980ee-4bcf-4781-b90f-75a2d22cd1c3 (Warm Sandbox Pool Manager < 500ms)."
      - key: task-storage-workspace-cleanup
        title: Implement on-demand artifact collection and post-task workspace deletion
        priority: high
        dependsOn:
          - task: task-partners-e2b-driver
            type: blocks
        comments:
          - "Planning: Only collect artifacts when explicitly requested by task deliverables. Explicitly delete persistent sandboxes on finish to eliminate storage bloat."
          - "Partners Receipt Alignment: Tracks upstream Partners task 2284de45-e827-4464-913e-7448c59e339d (Snapshot & Template API POST /v1/sessions/:id/snapshots)."

  - key: req-cli-ti-debugging
    title: CLI Debugging, Inspection, and Direct Sandbox Access
    status: approved
    priority: medium
    modelTier: standard
    documents:
      - document: ti-agent-arch
        type: documents
    slices:
      - key: slice-cli-commands
        title: CLI Ti Subcommand Suite Overhaul
        orderIndex: 0
        tasks: [task-cli-ti-commands, task-cli-sandbox-debug]
    tasks:
      - key: task-cli-ti-commands
        title: Update tw ti CLI commands for runs, models, and real-time log streaming
        priority: medium
        comments:
          - "Planning: Retire local pi binary spawn in CLI. Support tw ti run list/create/logs --follow directly targeting the API and Partners worker."
      - key: task-cli-sandbox-debug
        title: Implement tw ti sandbox shell and interactive inspection
        priority: medium
        dependsOn:
          - task: task-cli-ti-commands
            type: blocks
        comments:
          - "Planning: Provide developer tools to attach to running Partners sandboxes for debugging, manual inspection, and emergency teardown."
          - "Partners Receipt Alignment: Tracks upstream Partners task 08389eb4-815b-4592-9623-0b1660f94836 (Interactive PTY WebSocket channel) to unlock tw ti sandbox shell."

  - key: req-ti-business-integration
    title: Business Integration for Personal, Schedule, and Task Automation
    status: approved
    priority: high
    modelTier: standard
    documents:
      - document: ti-agent-arch
        type: documents
    slices:
      - key: slice-personal-schedule
        title: Personal and Schedule Automation
        orderIndex: 0
        tasks: [task-personal-inbox-triage, task-schedule-inspection-templates]
      - key: slice-task-delegation
        title: Task Delegation and Review Workflow
        orderIndex: 1
        tasks: [task-delegation-review-loop]
    tasks:
      - key: task-personal-inbox-triage
        title: Build Ti-assisted Personal Inbox triage and daily briefing
        priority: medium
        comments:
          - "Planning: Allow users to trigger Ti to categorize, prioritize, and structure fragmented thoughts and personal to-do items."
      - key: task-schedule-inspection-templates
        title: Equip schedules with automated inspection templates and diagnostic feedback
        priority: medium
        comments:
          - "Planning: Schedules run diagnostic templates in E2B sandboxes and attach structured findings as task comments."
      - key: task-delegation-review-loop
        title: Implement end-to-end task delegation with verification notes and in_review transition
        priority: high
        dependsOn:
          - task: task-schedule-inspection-templates
            type: blocks
        comments:
          - "Planning: Tasks assigned to Ti Agent execute in Partners sandboxes, compile verification diffs, and transition to in_review for human acceptance."
          - "Partners Receipt Alignment: Prepares for upstream Partners task 1a9090b3-2197-4da6-9aba-bb1d1b6a3c4a (/preview/:sessionId/:port/*) to allow live web preview of task outputs."

