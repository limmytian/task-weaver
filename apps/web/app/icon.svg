<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">Task Weaver</title>
<desc id="desc">Two equally weighted paths weave over and under each other.</desc>
<style>.first{stroke:#4f46e5}.second{stroke:#0369a1}@media(prefers-color-scheme:dark){.first{stroke:#a5b4fc}.second{stroke:#7dd3fc}}</style><g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<defs>
<mask maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" id="a-first">
<rect width="64" height="64" fill="white"/>
<path d="M34 42h16" stroke="black" stroke-width="12"/>
</mask>
<mask maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" id="a-second">
<rect width="64" height="64" fill="white"/>
<path d="M14 22h16" stroke="black" stroke-width="12"/>
</mask>
</defs>
<path d="M12 22h22q8 0 8 8v22" class="first" mask="url(#a-first)"/>
<path d="M22 12v22q0 8 8 8h22" class="second" mask="url(#a-second)"/>
</g>
</svg>
